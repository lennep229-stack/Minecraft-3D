<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Builder mit Hotbar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 15px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
        .info-box {
            display: inline-block;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
        }

        /* Hotbar UI Style */
        #hotbar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 10px;
            border: 2px solid #555;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .slot {
            width: 50px;
            height: 50px;
            margin: 0 4px;
            border: 3px solid #444;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: transform 0.1s ease;
        }
        .slot:hover {
            transform: scale(1.08);
        }
        .slot.active {
            border-color: #ffcc00;
            box-shadow: 0 0 10px #ffcc00;
        }
        .slot-num {
            position: absolute;
            top: 2px;
            left: 4px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="info">
        <div class="info-box">
            🎮 <b>Klick:</b> Abbauen | <kbd>Shift</kbd> + <b>Klick:</b> Bauen | <b>Rechte Maustaste:</b> Drehen | <b>1-6:</b> Block wählen
        </div>
    </div>

    <!-- Hotbar UI -->
    <div id="hotbar-container">
        <div class="slot active" data-index="0" onclick="selectBlock(0)">
            <span class="slot-num">1</span>
        </div>
        <div class="slot" data-index="1" onclick="selectBlock(1)">
            <span class="slot-num">2</span>
        </div>
        <div class="slot" data-index="2" onclick="selectBlock(2)">
            <span class="slot-num">3</span>
        </div>
        <div class="slot" data-index="3" onclick="selectBlock(3)">
            <span class="slot-num">4</span>
        </div>
        <div class="slot" data-index="4" onclick="selectBlock(4)">
            <span class="slot-num">5</span>
        </div>
        <div class="slot" data-index="5" onclick="selectBlock(5)">
            <span class="slot-num">6</span>
        </div>
    </div>

    <!-- 1. Three.js Hauptbibliothek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 2. OrbitControls Erweiterung -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Szene, Kamera & Renderer aufsetzen
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(
            75, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(4, 5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Maus-Steuerung
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // Beleuchtung
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(10, 20, 15);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Texturen laden
        const textureLoader = new THREE.TextureLoader();
        function loadMinecraftTexture(url) {
            const texture = textureLoader.load(url);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const BASE_URL = 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/';

        const texGrassSide = loadMinecraftTexture(BASE_URL + 'grass_block_side.png');
        const texGrassTop  = loadMinecraftTexture(BASE_URL + 'grass_block_top.png');
        const texDirt      = loadMinecraftTexture(BASE_URL + 'dirt.png');
        const texStone     = loadMinecraftTexture(BASE_URL + 'stone.png');
        const texPlanks    = loadMinecraftTexture(BASE_URL + 'oak_planks.png');
        const texDiamond   = loadMinecraftTexture(BASE_URL + 'diamond_block.png');
        const texBricks    = loadMinecraftTexture(BASE_URL + 'bricks.png');
        const texCobble    = loadMinecraftTexture(BASE_URL + 'cobblestone.png');

        // Block-Definitionen (Materialien)
        const blockTypes = [
            {
                name: 'Gras',
                icon: BASE_URL + 'grass_block_side.png',
                materials: [
                    new THREE.MeshStandardMaterial({ map: texGrassSide }),
                    new THREE.MeshStandardMaterial({ map: texGrassSide }),
                    new THREE.MeshStandardMaterial({ map: texGrassTop, color: 0x7cbd6b }),
                    new THREE.MeshStandardMaterial({ map: texDirt }),
                    new THREE.MeshStandardMaterial({ map: texGrassSide }),
                    new THREE.MeshStandardMaterial({ map: texGrassSide })
                ]
            },
            {
                name: 'Stein',
                icon: BASE_URL + 'stone.png',
                materials: new THREE.MeshStandardMaterial({ map: texStone })
            },
            {
                name: 'Holz',
                icon: BASE_URL + 'oak_planks.png',
                materials: new THREE.MeshStandardMaterial({ map: texPlanks })
            },
            {
                name: 'Diamant',
                icon: BASE_URL + 'diamond_block.png',
                materials: new THREE.MeshStandardMaterial({ map: texDiamond })
            },
            {
                name: 'Ziegel',
                icon: BASE_URL + 'bricks.png',
                materials: new THREE.MeshStandardMaterial({ map: texBricks })
            },
            {
                name: 'Bruchstein',
                icon: BASE_URL + 'cobblestone.png',
                materials: new THREE.MeshStandardMaterial({ map: texCobble })
            }
        ];

        let activeBlockIndex = 0;

        // UI-Hotbar Vorschauen setzen
        const slots = document.querySelectorAll('.slot');
        slots.forEach((slot, idx) => {
            slot.style.backgroundImage = `url('${blockTypes[idx].icon}')`;
        });

        function selectBlock(index) {
            activeBlockIndex = index;
            slots.forEach((s, idx) => {
                if (idx === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        // Tastatur 1-6 abfangen
        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '6') {
                selectBlock(parseInt(e.key) - 1);
            }
        });

        // 3D-Geometrie & Objekte
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const objects = [];

        // Bodenplatte
        const planeGeometry = new THREE.PlaneGeometry(20, 20);
        planeGeometry.rotateX(-Math.PI / 2);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x22222b });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);
        objects.push(plane);

        // Boden-Gitternetz
        const gridHelper = new THREE.GridHelper(20, 20, 0x555555, 0x333333);
        gridHelper.position.y = -0.49;
        scene.add(gridHelper);

        // Vorschau-Rahmen
        const rollOverGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
        const rollOverMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
        const rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMaterial);
        scene.add(rollOverMesh);

        // Start-Block erstellen
        createBlock(0, 0, 0, 0);

        function createBlock(x, y, z, typeIndex) {
            const mat = blockTypes[typeIndex].materials;
            const block = new THREE.Mesh(blockGeometry, mat);
            block.position.set(x, y, z);
            block.castShadow = true;
            block.receiveShadow = true;
            scene.add(block);
            objects.push(block);
        }

        // Raycaster
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isShiftDown = false;

        document.addEventListener('keydown', (e) => { if (e.key === 'Shift') isShiftDown = true; });
        document.addEventListener('keyup', (e) => { if (e.key === 'Shift') isShiftDown = false; });

        // Maus-Vorschau
        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (isShiftDown) {
                    const targetPos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    rollOverMesh.position.copy(targetPos).floor().addScalar(0.5);
                    rollOverMesh.visible = true;
                } else {
                    if (intersect.object !== plane) {
                        rollOverMesh.position.copy(intersect.object.position);
                        rollOverMesh.visible = true;
                    } else {
                        rollOverMesh.visible = false;
                    }
                }
            } else {
                rollOverMesh.visible = false;
            }
        });

        // Klick-Event
        window.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            // Verhindern, dass Klicks auf die UI-Elemente Blöcke im 3D-Raum setzen
            if (event.target.closest('#hotbar-container')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (isShiftDown) {
                    // BLOCK SETZEN (mit ausgewählter Blockart)
                    const targetPos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5)).floor().addScalar(0.5);
                    createBlock(targetPos.x, targetPos.y, targetPos.z, activeBlockIndex);
                } else {
                    // BLOCK ABBAUEN
                    if (intersect.object !== plane) {
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                        rollOverMesh.visible = false;
                    }
                }
            }
        });

        // Animations-Schleife
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Anpassung
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
