<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Schematic & Builder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 15px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
        .info-box {
            display: inline-block;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
        }

        /* Top Menu Bar */
        #menu-container {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        .btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover {
            background: #ffcc00;
            color: black;
            border-color: #ffcc00;
        }

        /* Layer Slider UI */
        #layer-container {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid #555;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 20;
            user-select: none;
        }
        #layer-slider {
            writing-mode: bt-lr; /* Vertical slider */
            -webkit-appearance: slider-vertical;
            width: 25px;
            height: 200px;
            cursor: pointer;
        }

        /* Hotbar UI Style */
        #hotbar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 10px;
            border: 2px solid #555;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .slot {
            width: 50px;
            height: 50px;
            margin: 0 4px;
            border: 3px solid #444;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: transform 0.1s ease;
        }
        .slot:hover {
            transform: scale(1.08);
        }
        .slot.active {
            border-color: #ffcc00;
            box-shadow: 0 0 10px #ffcc00;
        }
        .slot-num {
            position: absolute;
            top: 2px;
            left: 4px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="info">
        <div class="info-box">
            🎮 <b>Klick:</b> Abbauen | <kbd>Shift</kbd> + <b>Klick:</b> Bauen | <b>Rechte Maustaste:</b> Drehen | <b>1-6:</b> Block wählen
        </div>
    </div>

    <!-- Actions Menu -->
    <div id="menu-container">
        <button class="btn" onclick="document.getElementById('schematic-input').click()">📦 Schematic Laden</button>
        <button class="btn" onclick="exportWorld()">💾 Speichern</button>
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 Laden</button>
        <button class="btn" onclick="clearWorld()">🗑️ Leeren</button>
        <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importWorld(event)">
        <input type="file" id="schematic-input" style="display: none;" accept=".schematic" onchange="loadSchematicFile(event)">
    </div>

    <!-- Layer Control Slider -->
    <div id="layer-container">
        <span style="font-size: 12px; font-weight: bold;">Ebene</span>
        <input type="range" id="layer-slider" min="0" max="100" value="100" oninput="updateLayerVisibility(this.value)">
        <span id="layer-val" style="font-size: 14px; font-weight: bold;">Max</span>
    </div>

    <!-- Hotbar UI -->
    <div id="hotbar-container">
        <div class="slot active" data-index="0" onclick="selectBlock(0)"><span class="slot-num">1</span></div>
        <div class="slot" data-index="1" onclick="selectBlock(1)"><span class="slot-num">2</span></div>
        <div class="slot" data-index="2" onclick="selectBlock(2)"><span class="slot-num">3</span></div>
        <div class="slot" data-index="3" onclick="selectBlock(3)"><span class="slot-num">4</span></div>
        <div class="slot" data-index="4" onclick="selectBlock(4)"><span class="slot-num">5</span></div>
        <div class="slot" data-index="5" onclick="selectBlock(5)"><span class="slot-num">6</span></div>
    </div>

    <!-- Libraries: Three.js, Controls & NBT/Gzip Parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sjrd/nbt.js@master/nbt.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 10, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(15, 30, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Texturen & Material-Verwaltung
        const textureLoader = new THREE.TextureLoader();
        function loadMinecraftTexture(url) {
            const texture = textureLoader.load(url);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const BASE_URL = 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/';

        const texGrassSide = loadMinecraftTexture(BASE_URL + 'grass_block_side.png');
        const texGrassTop  = loadMinecraftTexture(BASE_URL + 'grass_block_top.png');
        const texDirt      = loadMinecraftTexture(BASE_URL + 'dirt.png');
        const texStone     = loadMinecraftTexture(BASE_URL + 'stone.png');
        const texPlanks    = loadMinecraftTexture(BASE_URL + 'oak_planks.png');
        const texDiamond   = loadMinecraftTexture(BASE_URL + 'diamond_block.png');
        const texBricks    = loadMinecraftTexture(BASE_URL + 'bricks.png');
        const texCobble    = loadMinecraftTexture(BASE_URL + 'cobblestone.png');

        const blockTypes = [
            {
                name: 'Gras',
                icon: BASE_URL + 'grass_block_side.png',
                materials: [
                    new THREE.MeshStandardMaterial({ map: texGrassSide }),
                    new THREE.MeshStandardMaterial({ map: texGrassSide }),
                    new THREE.MeshStandardMaterial({ map: texGrassTop, color: 0x7cbd6b }),
                    new THREE.MeshStandardMaterial({ map: texDirt }),
                    new THREE.MeshStandardMaterial({ map: texGrassSide }),
                    new THREE.MeshStandardMaterial({ map: texGrassSide })
                ]
            },
            { name: 'Stein', icon: BASE_URL + 'stone.png', materials: new THREE.MeshStandardMaterial({ map: texStone }) },
            { name: 'Holz', icon: BASE_URL + 'oak_planks.png', materials: new THREE.MeshStandardMaterial({ map: texPlanks }) },
            { name: 'Diamant', icon: BASE_URL + 'diamond_block.png', materials: new THREE.MeshStandardMaterial({ map: texDiamond }) },
            { name: 'Ziegel', icon: BASE_URL + 'bricks.png', materials: new THREE.MeshStandardMaterial({ map: texBricks }) },
            { name: 'Bruchstein', icon: BASE_URL + 'cobblestone.png', materials: new THREE.MeshStandardMaterial({ map: texCobble }) }
        ];

        let activeBlockIndex = 0;
        const slots = document.querySelectorAll('.slot');
        slots.forEach((slot, idx) => { slot.style.backgroundImage = `url('${blockTypes[idx].icon}')`; });

        function selectBlock(index) {
            activeBlockIndex = index;
            slots.forEach((s, idx) => {
                if (idx === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '6') selectBlock(parseInt(e.key) - 1);
        });

        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const objects = [];
        const blocksData = [];

        // Bodenplatte & Gitter
        const planeGeometry = new THREE.PlaneGeometry(30, 30);
        planeGeometry.rotateX(-Math.PI / 2);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x22222b });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);
        objects.push(plane);

        const gridHelper = new THREE.GridHelper(30, 30, 0x555555, 0x333333);
        gridHelper.position.y = -0.49;
        scene.add(gridHelper);

        const rollOverGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
        const rollOverMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
        const rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMaterial);
        scene.add(rollOverMesh);

        function createBlock(x, y, z, typeIndex, save = true) {
            const mat = blockTypes[typeIndex] ? blockTypes[typeIndex].materials : blockTypes[0].materials;
            const block = new THREE.Mesh(blockGeometry, mat);
            block.position.set(x, y, z);
            block.castShadow = true;
            block.receiveShadow = true;
            block.userData = { x, y, z, type: typeIndex };
            scene.add(block);
            objects.push(block);

            if (save) {
                blocksData.push({ x, y, z, type: typeIndex });
                saveToLocalStorage();
            }
        }

        function removeBlock(blockMesh) {
            scene.remove(blockMesh);
            objects.splice(objects.indexOf(blockMesh), 1);
            const index = blocksData.findIndex(b => b.x === blockMesh.userData.x && b.y === blockMesh.userData.y && b.z === blockMesh.userData.z);
            if (index !== -1) blocksData.splice(index, 1);
            saveToLocalStorage();
        }

        // --- SCHEMATIC PARSER LOGIK ---
        function loadSchematicFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const buffer = e.target.result;
                    let uncompressed;
                    try {
                        uncompressed = pako.ungzip(new Uint8Array(buffer));
                    } catch (err) {
                        uncompressed = new Uint8Array(buffer);
                    }

                    nbt.parse(uncompressed, function(error, data) {
                        if (error) {
                            alert("Fehler beim Lesen der Schematic-Datei!");
                            return;
                        }

                        clearWorld(false);

                        const value = data.value;
                        const width = value.Width.value;
                        const height = value.Height.value;
                        const length = value.Length.value;
                        const blocks = value.Blocks.value;

                        // Max-Höhe für Slider einstellen
                        const slider = document.getElementById('layer-slider');
                        slider.max = height;
                        slider.value = height;
                        document.getElementById('layer-val').innerText = height;

                        let blockIdx = 0;
                        for (let y = 0; y < height; y++) {
                            for (let z = 0; z < length; z++) {
                                for (let x = 0; x < width; x++) {
                                    const blockId = blocks[blockIdx];
                                    if (blockId !== 0) { // 0 = Luft
                                        let typeIndex = 1; // Standard Stein
                                        if (blockId === 2 || blockId === 3) typeIndex = 0; // Gras/Erde
                                        else if (blockId === 5 || blockId === 17) typeIndex = 2; // Holz
                                        else if (blockId === 57) typeIndex = 3; // Diamant
                                        else if (blockId === 45) typeIndex = 4; // Ziegel
                                        else if (blockId === 4) typeIndex = 5; // Bruchstein

                                        createBlock(x - Math.floor(width/2), y, z - Math.floor(length/2), typeIndex, true);
                                    }
                                    blockIdx++;
                                }
                            }
                        }
                    });
                } catch (err) {
                    alert("Konnte die Datei nicht verarbeiten.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- LAYER SLIDER (EBENEN-FILTER) ---
        function updateLayerVisibility(maxY) {
            document.getElementById('layer-val').innerText = maxY;
            objects.forEach(obj => {
                if (obj !== plane) {
                    obj.visible = obj.position.y <= parseInt(maxY);
                }
            });
        }

        // --- SPEICHERN & LADEN LOGIK ---
        function saveToLocalStorage() { localStorage.setItem('minecraft_world', JSON.stringify(blocksData)); }

        function loadFromLocalStorage() {
            const savedWorld = localStorage.getItem('minecraft_world');
            if (savedWorld) {
                const parsed = JSON.parse(savedWorld);
                parsed.forEach(b => createBlock(b.x, b.y, b.z, b.type, true));
            } else {
                createBlock(0, 0, 0, 0, true);
            }
        }

        function exportWorld() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(blocksData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "mein-minecraft-bauwerk.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importWorld(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const importedData = JSON.parse(e.target.result);
                clearWorld(false);
                importedData.forEach(b => createBlock(b.x, b.y, b.z, b.type, true));
            };
            reader.readAsText(file);
        }

        function clearWorld(ask = true) {
            if (ask && !confirm("Möchtest du wirklich alle Blöcke löschen?")) return;
            for (let i = objects.length - 1; i >= 0; i--) {
                if (objects[i] !== plane) scene.remove(objects[i]);
            }
            objects.length = 0;
            objects.push(plane);
            blocksData.length = 0;
            saveToLocalStorage();
            if (rollOverMesh) rollOverMesh.visible = false;
        }

        // Raycaster & Interaktionen
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isShiftDown = false;

        document.addEventListener('keydown', (e) => { if (e.key === 'Shift') isShiftDown = true; });
        document.addEventListener('keyup', (e) => { if (e.key === 'Shift') isShiftDown = false; });

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (isShiftDown) {
                    const targetPos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    rollOverMesh.position.copy(targetPos).floor().addScalar(0.5);
                    rollOverMesh.visible = true;
                } else {
                    if (intersect.object !== plane) {
                        rollOverMesh.position.copy(intersect.object.position);
                        rollOverMesh.visible = true;
                    } else {
                        rollOverMesh.visible = false;
                    }
                }
            } else {
                rollOverMesh.visible = false;
            }
        });

        window.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            if (event.target.closest('#hotbar-container') || event.target.closest('#menu-container') || event.target.closest('#layer-container')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (isShiftDown) {
                    const targetPos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5)).floor().addScalar(0.5);
                    createBlock(targetPos.x, targetPos.y, targetPos.z, activeBlockIndex, true);
                } else {
                    if (intersect.object !== plane) {
                        removeBlock(intersect.object);
                        rollOverMesh.visible = false;
                    }
                }
            }
        });

        loadFromLocalStorage();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
