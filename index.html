<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px 0;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="info">
        🌱 <b>Minecraft 3D Grasblock</b> | Steuerung mit der Maus aktiv!
    </div>

    <!-- 1. Three.js Hauptbibliothek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 2. OrbitControls Erweiterung -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Szene, Kamera & Renderer aufsetzen
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24); // Schöner dunkler Nachthimmel-Hintergrund

        const camera = new THREE.PerspectiveCamera(
            75, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(2.5, 2.5, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Schatten aktivieren!
        document.body.appendChild(renderer.domElement);

        // Maus-Steuerung
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Beleuchtung (Sonne + Umgebungslicht)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(6, 12, 8);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // TEXTUREN LADEN (Gras oben, Erde an den Seiten, Erde unten)
        const textureLoader = new THREE.TextureLoader();
        
        // Pixel-Art scharf halten (nicht verschwommen filtern)
        function loadMinecraftTexture(url) {
            const texture = textureLoader.load(url);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const textureSide = loadMinecraftTexture('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/grass_block_side.png');
        const textureTop = loadMinecraftTexture('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/grass_block_top.png');
        const textureBottom = loadMinecraftTexture('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/dirt.png');

        // Material-Liste für die 6 Seiten des Würfels (Rechts, Links, Oben, Unten, Vorne, Hinten)
        const materials = [
            new THREE.MeshStandardMaterial({ map: textureSide }), // Rechts
            new THREE.MeshStandardMaterial({ map: textureSide }), // Links
            new THREE.MeshStandardMaterial({ map: textureTop, color: 0x7cbd6b }),  // Oben (mit typischer Minecraft-Grasfarbe)
            new THREE.MeshStandardMaterial({ map: textureBottom }), // Unten
            new THREE.MeshStandardMaterial({ map: textureSide }), // Vorne
            new THREE.MeshStandardMaterial({ map: textureSide })  // Hinten
        ];

        // 3D-Block mit den Texturen erstellen
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const block = new THREE.Mesh(geometry, materials);
        block.castShadow = true;
        scene.add(block);

        // Bodenplatte für Schattenwurf
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x22222b });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);

        // Animations-Schleife
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Fenster-Anpassung
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
